name: Crear APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk GatasGuerreras.apk
      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GatasGuerreras-apk
          path: GatasGuerreras.apk
      - name: Publicar APK en Releases (descarga directa)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" GatasGuerreras.apk --title "Gatas Guerreras (compilación ${{ github.run_number }})" --notes "APK de prueba. Descarga GatasGuerreras.apk e instálalo en Android."
