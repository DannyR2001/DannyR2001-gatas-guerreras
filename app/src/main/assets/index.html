function portrait(im,x,y,r,ring){
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.closePath();ctx.fillStyle='#3a2e21';ctx.fill();ctx.clip();

  ctx.restore();ctx.strokeStyle=ring;ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.stroke();
}

  ctx.save();const sh=G.shake>0?G.shake*18:0;ctx.translate(Math.round(-camX+rand(-sh,sh)),Math.round(rand(-sh,sh)));drawWorld();ctx.restore();
  if(st==='play'){if(G.cine)drawCine();drawHUD();if(!G.cine)drawTouch();return}
  if(st==='pause'){shade(.78);txt('PAUSA',cx,58,46,'#fff','center',F1,'#c0283a');drawHow(98,true);
    ctx.fillStyle='#35d07f';rr(cx-230,470,210,48,24);ctx.fill();txt('CONTINUAR',cx-125,504,26,'#fff','center',F1,'#1c1830');
    ctx.fillStyle='#ff5a5a';rr(cx+20,470,210,48,24);ctx.fill();txt('SALIR AL MENÚ',cx+125,504,26,'#fff','center',F1,'#1c1830')}
  else if(st==='clear'){shade(.6);txt('¡NIVEL SUPERADO!',cx,150,64,'#ffe53d','center',F1,'#c0283a');
    drawCat(cx,290,1,P.ch.pal,{t:G.t,scale:2.2,pose:'win'});
    txt('Puntos: '+G.score+'   ·   Pescaditos: '+G.fish+'   ·   Mejor racha: '+G.maxHits+' golpes',cx,350,20,'#fff','center',F2,'#1c1830',600);
    txt('Siguiente: '+LNAMES[G.level+1],cx,392,22,'#ffe9a8','center',F2,'#1c1830',700);if(G.stT>.7)pulse('TOCA PARA CONTINUAR',460)}
  else if(st==='over'){shade(.75);txt('FIN DEL JUEGO',cx,180,72,'#ff5a5a','center',F1,'#1c1830');txt('Los ratones ganaron esta vez…',cx,230,22,'#fff','center',F2,null,600);
    txt('Puntos: '+G.score+'   ·   Récord: '+G.best,cx,280,22,'#ffe9a8','center',F2,null,700);if(G.stT>.7)pulse('TOCA PARA VOLVER A INTENTAR',380)}
  else if(st==='win'){shade(.6);txt('¡VICTORIA!',cx,120,84,'#ffe53d','center',F1,'#c0283a');
    portrait(P.ch.id==='tigresa'?img.t:img.l,cx-150,250,70,P.ch.pal.collar);drawCat(cx+110,318,-1,P.ch.pal,{t:G.t,scale:2.6,pose:'win'});
    txt(P.ch.name+' derrotó al Rey Ratón',cx,372,26,'#fff','center',F2,'#1c1830',700);
    txt('Puntos: '+G.score+'  ·  Récord: '+G.best+'  ·  Pescaditos: '+G.fish+'  ·  Ratones: '+G.kills,cx,408,19,'#ffe9a8','center',F2,'#1c1830',600);
    if(Math.random()<.4)parts.push({x:rand(0,LW)+camX,y:-10,vx:rand(-30,30),vy:rand(80,200),life:3,max:3,c:['#ff5fa2','#ffe53d','#58d6ff','#4fe07a'][Math.random()*4|0],s:7,g:60});
    for(const q of parts){q.life-=.016;q.x+=q.vx*.016;q.y+=q.vy*.016;ctx.fillStyle=q.c;ctx.fillRect(q.x-camX,q.y,q.s,q.s)}parts=parts.filter(q=>q.life>0);
    if(G.stT>1)pulse('TOCA PARA JUGAR DE NUEVO',480)}
}
/* ================= ENTRADA ================= */
function uiTap(pos){
  const st=G.state,cx=LW/2;
  if(st==='menu'){cards().forEach((c,i)=>{if(pos.x>c.x&&pos.x<c.x+c.w&&pos.y>c.y&&pos.y<c.y+c.h){G.char=G.sel=i;setState('howto');SFX.tok()}})}
  else if(st==='howto'){if(G.stT>.35)startGame()}
  else if(st==='pause'){if(pos.y>455&&pos.x>cx+10&&pos.x<cx+240){setState('menu')}else if(G.stT>.2)setState('play')}
  else if(st==='clear'){if(G.stT>.7){G.level++;startLevel()}}
  else if(st==='over'||st==='win'){if(G.stT>(st==='win'?1:.7)){parts=[];setState('menu')}}
}
function press(k){if(k==='jump'){I.pJump=true;I.jumpHeld=true}else if(k==='kick')I.pKick=true;else if(k==='combo')I.pCombo=true;else if(k==='charge')I.bcharge=true}
function release(k){if(k==='jump')I.jumpHeld=false;else if(k==='charge')I.bcharge=false}
function setJoy(pos){const dx=pos.x-joy.cx,dy=pos.y-joy.cy,d=Math.hypot(dx,dy),m=52;if(d>m){joy.x=dx/d;joy.y=dy/d;if(d>m*1.7){joy.cx=pos.x-joy.x*m*1.7;joy.cy=pos.y-joy.y*m*1.7}}else{joy.x=dx/m;joy.y=dy/m}}
function pdown(e){
  e.preventDefault();initAudio();const pos=toLogical(e);
  if(G.state!=='play'){uiTap(pos);return}
  if(Math.hypot(pos.x-(LW-40),pos.y-38)<28){for(const k in held)delete held[k];I.bcharge=I.jumpHeld=false;joy.id=null;joy.x=joy.y=0;setState('pause');return}
  if(Math.hypot(pos.x-(LW-92),pos.y-38)<28){muted=!muted;return}
  if(pos.x<LW*.46){if(joy.id===null){joy.id=e.pointerId;joy.cx=clamp(pos.x,70,LW*.46-30);joy.cy=clamp(pos.y,110,LH-60);joy.x=joy.y=0;setJoy(pos)}return}
  let best=null,bd=1e9;for(const b of btns()){const d=Math.hypot(pos.x-b.x,pos.y-b.y);if(d<b.r+22&&d<bd){bd=d;best=b}}
  if(best){held[best.k]=e.pointerId;press(best.k)}
}
function pmove(e){if(joy.id===e.pointerId){e.preventDefault();setJoy(toLogical(e))}}
function pup(e){
  if(joy.id===e.pointerId){joy.id=null;joy.x=joy.y=0}
  for(const k in held)if(held[k]===e.pointerId){delete held[k];release(k)}
}
const KEYS={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowDown:'d',s:'d',S:'d',ArrowUp:'j',w:'j',W:'j',' ':'j',j:'k',J:'k',z:'k',Z:'k',k:'c',K:'c',x:'c',X:'c',c:'g',C:'g',l:'g',L:'g',Shift:'g'};
function kdown(e){
  const k=KEYS[e.key];initAudio();
  if(G.state!=='play'){if(e.repeat)return;if(e.key==='Enter'||e.key===' '){if(G.state==='menu'){G.char=G.sel;setState('howto')}else uiTap({x:0,y:0})}
    else if(G.state==='menu'&&(k==='l'||k==='r'))G.sel=k==='l'?0:1;else if(G.state==='pause'&&(e.key==='p'||e.key==='P'||e.key==='Escape'))setState('play');return}
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){setState('pause');return}
  if(!k)return;e.preventDefault();if(e.repeat)return;
  if(k==='l')I.kl=true;else if(k==='r')I.kr=true;else if(k==='d')I.kdown=true;else if(k==='j')press('jump');else if(k==='k')press('kick');else if(k==='g')I.kcharge=true;else press('combo');
}
function kup(e){const k=KEYS[e.key];if(k==='l')I.kl=false;else if(k==='r')I.kr=false;else if(k==='d')I.kdown=false;else if(k==='j')release('jump');else if(k==='g')I.kcharge=false}
cv.addEventListener('pointerdown',pdown,{passive:false});window.addEventListener('pointermove',pmove,{passive:false});
window.addEventListener('pointerup',pup);window.addEventListener('pointercancel',pup);
window.addEventListener('keydown',kdown);window.addEventListener('keyup',kup);window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')setState('pause')});
['touchstart','touchmove','contextmenu','gesturestart','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
try{document.fonts.load('700 40px "Pixelify Sans"');document.fonts.load('600 16px "Pixelify Sans"')}catch(e){}
/* ================= BUCLE ================= */
let last=0;
function frame(ts){
  const dt=Math.min(.033,Math.max(.001,(ts-last)/1000||.016));last=ts;
  try{update(dt);music();render()}catch(err){if(window.__TEST)throw err;console.error(err)}
  requestAnimationFrame(frame);
}
resize();requestAnimationFrame(frame);
window.__G={G,I,get P(){return P},get L(){return L},get ens(){return ens},get boss(){return boss},uiTap,press,release,get cine(){return G.cine},startGame,startLevel,setState,killEnemy};
})();
