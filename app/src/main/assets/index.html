<script>
(()=>{'use strict';
/* ============ GATAS GUERRERAS — Tigresa y Leona ============ */
const cv=document.getElementById('c'),mctx=cv.getContext('2d'),low=document.createElement('canvas'),lctx=low.getContext('2d'),TQ=[];
let PX=3,REFL=false; // tamaño del píxel: el juego se dibuja a 1/3 de resolución y se amplía sin suavizado
let ctx=lctx,RETRO=true;
const glow=document.createElement('canvas'),gctx=glow.getContext('2d');
// Tono HDR: curva en S (más contraste), sombras profundas y paleta por escalones para conservar el aire retro
const LUT=new Uint8Array(256);for(let i=0;i<256;i++){let v=i/255;const sm=v*v*(3-2*v);v=v+(sm-v)*.55;v=Math.pow(v,.94);LUT[i]=Math.min(255,Math.round(v*255/12)*12)}
const LH=540,GRAV=1700,GY=440;
let LW=960,SC=1,RS=1,ROT=false,OX=0,OY=0,VW=0,VH=0;
const F1="'Pixelify Sans',Impact,'Arial Black',sans-serif",F2="'Pixelify Sans','Trebuchet MS',system-ui,sans-serif";
function resize(){
  VW=window.innerWidth||960;VH=window.innerHeight||540;ROT=VH>VW;
  const long=Math.max(VW,VH),short=Math.min(VW,VH);
  LW=Math.round(Math.max(760,Math.min(1300,LH*long/short)));
  SC=Math.min(long/LW,short/LH);
  const cw=LW*SC,ch=LH*SC;OX=(long-cw)/2;OY=(short-ch)/2;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(2,Math.round(cw*dpr));cv.height=Math.max(2,Math.round(ch*dpr));
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  cv.style.transform=ROT?`translate(${VW-OY}px,${OX}px) rotate(90deg)`:`translate(${OX}px,${OY}px)`;
  RS=cv.width/LW;low.width=Math.ceil(LW/PX);low.height=Math.ceil(LH/PX);glow.width=Math.ceil(low.width/4);glow.height=Math.ceil(low.height/4);
}
function toLogical(e){
  let cx,cy;

function moveEntity(e,dt){
  const hw=e.w/2;e.x+=e.vx*dt;
  for(const s of L.solids){
    if(e.x+hw>s.x+.001&&e.x-hw<s.x+s.w-.001&&e.y>s.y+1&&e.y-e.h<s.y+s.h){
      const left=e.vx>0||(e.vx===0&&e.x<s.x+s.w/2);
      e.x=left?s.x-hw:s.x+s.w+hw;e.hitWall=true;if(!e.keepVx)e.vx=0;
    }
  }
  const py=e.y;e.y+=e.vy*dt;e.onGround=false;
  if(e.vy>=0){
    for(const s of L.solids){if(e.x+hw>s.x+.001&&e.x-hw<s.x+s.w-.001&&e.y>=s.y&&py<=s.y+24){e.y=s.y;e.vy=0;e.onGround=true;e.gnd=s}}

}

function goSub(s,back){G.back=back;setState(s)}
function goBack(){const b=G.back||'menu';G.back=null;setState(b)}
function restartLevel(){G.score=G.lvScore;G.furia=0;P=null;startLevel()}
function toggleOpt(k){if(k==='snd')muted=!muted;else{OPT[k]=OPT[k]?0:1;if(k==='hd')applyOpts()}saveOpts();SFX.fish()}
function chooseCat(i){G.char=G.sel=i;SFX.tok();if(G.seenHow)startGame();else{G.seenHow=true;try{localStorage.setItem('gatasVisto','1')}catch(e){}G.back=null;setState('howto')}}
function uiTap(pos){
  const st=G.state,cx=LW/2;
  if(st==='menu'){
    for(const b of menuBtns())if(hit(pos,b)){SFX.fish();goSub(b.k,'menu');return}
    if(G.saved>0&&hit(pos,{x:cx-205,y:446,w:410,h:44})){G.startAt=G.startAt?0:G.saved;SFX.fish();return}
    cards().forEach((c,i)=>{if(hit(pos,c))chooseCat(i)})}
  else if(st==='howto'){if(G.stT>.35){if(G.back)goBack();else startGame()}}
  else if(st==='levels'){if(hit(pos,backBtn())){goBack();return}
    for(const c of lvCells())if(hit(pos,c)){if(c.n<=G.saved){G.char=G.sel;G.startAt=c.n;G.back=null;SFX.tok();startGame()}else SFX.hurt();return}}
  else if(st==='options'){if(hit(pos,backBtn())){goBack();return}for(const o of optTiles())if(hit(pos,o)){toggleOpt(o.k);return}}
  else if(st==='pause'){if(G.stT<.2)return;
    for(const b of pauseBtns())if(hit(pos,b)){SFX.fish();
      if(b.k==='resume')setState('play');else if(b.k==='restart')restartLevel();else if(b.k==='menu'){G.back=null;setState('menu')}else goSub(b.k,'pause');return}}
  else if(st==='clear'){if(G.stT>.7){G.level++;startLevel()}}
  else if(st==='over'){if(G.stT>.7){if(pos.y>350&&pos.x>cx+5){parts=[];setState('menu')}else{G.lives=START_LIVES;restartLevel()}}}
  else if(st==='win'){if(G.stT>1){parts=[];G.startAt=0;setState('menu')}}
}
function press(k){if(k==='jump'){I.pJump=true;I.jumpHeld=true}else if(k==='kick')I.pKick=true;else if(k==='combo')I.pCombo=true;else if(k==='charge')I.bcharge=true}
function release(k){if(k==='jump')I.jumpHeld=false;else if(k==='charge')I.bcharge=false}
function setJoy(pos){const dx=pos.x-joy.cx,dy=pos.y-joy.cy,d=Math.hypot(dx,dy),m=52;if(d>m){joy.x=dx/d;joy.y=dy/d;if(d>m*1.7){joy.cx=pos.x-joy.x*m*1.7;joy.cy=pos.y-joy.y*m*1.7}}else{joy.x=dx/m;joy.y=dy/m}}
function pdown(e){
  e.preventDefault();initAudio();const pos=toLogical(e);
  if(G.state!=='play'){uiTap(pos);return}
  if(G.pick){for(const c of pickCards())if(pos.x>c.x&&pos.x<c.x+c.w&&pos.y>c.y&&pos.y<c.y+c.h)pickPower(c.el);return}
  if(Math.hypot(pos.x-(LW-40),pos.y-38)<28){for(const k in held)delete held[k];I.bcharge=I.jumpHeld=false;joy.id=null;joy.x=joy.y=0;setState('pause');return}
  if(Math.hypot(pos.x-(LW-92),pos.y-38)<28){muted=!muted;saveOpts();return}
  if(pos.x<LW*.46){if(joy.id===null){joy.id=e.pointerId;joy.cx=clamp(pos.x,70,LW*.46-30);joy.cy=clamp(pos.y,110,LH-60);joy.x=joy.y=0;setJoy(pos)}return}
  let best=null,bd=1e9;for(const b of btns()){const d=Math.hypot(pos.x-b.x,pos.y-b.y);if(d<b.r+22&&d<bd){bd=d;best=b}}
  if(best){held[best.k]=e.pointerId;press(best.k)}
}
function pmove(e){if(joy.id===e.pointerId){e.preventDefault();setJoy(toLogical(e))}}
function pup(e){
  if(joy.id===e.pointerId){joy.id=null;joy.x=joy.y=0}
  for(const k in held)if(held[k]===e.pointerId){delete held[k];release(k)}
}
const KEYS={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowDown:'d',s:'d',S:'d',ArrowUp:'j',w:'j',W:'j',' ':'j',j:'k',J:'k',z:'k',Z:'k',k:'c',K:'c',x:'c',X:'c',c:'g',C:'g',l:'g',L:'g',Shift:'g'};
function kdown(e){
  const k=KEYS[e.key];initAudio();
  if(G.state!=='play'){if(e.repeat)return;const st=G.state,esc=e.key==='Escape';
    if(st==='levels'||st==='options'||(st==='howto'&&G.back)){if(esc||e.key==='Enter')goBack()}
    else if(st==='pause'){if(esc||e.key==='p'||e.key==='P'||e.key==='Enter')setState('play');else if(e.key==='r'||e.key==='R')restartLevel()}
    else if(e.key==='Enter'||e.key===' '){if(st==='menu')chooseCat(G.sel);else uiTap({x:0,y:0})}
    else if(st==='menu'&&(k==='l'||k==='r'))G.sel=k==='l'?0:1;return}
  if(G.pick){const n='12345'.indexOf(e.key);if(n>=0)pickPower(POWERS[n][0]);return}
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){setState('pause');return}
  if(!k)return;e.preventDefault();if(e.repeat)return;
  if(k==='l')I.kl=true;else if(k==='r')I.kr=true;else if(k==='d')I.kdown=true;else if(k==='j')press('jump');else if(k==='k')press('kick');else if(k==='g')I.kcharge=true;else press('combo');
}
function kup(e){const k=KEYS[e.key];if(k==='l')I.kl=false;else if(k==='r')I.kr=false;else if(k==='d')I.kdown=false;else if(k==='j')release('jump');else if(k==='g')I.kcharge=false}
