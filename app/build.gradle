plugins {
    id 'com.android.application'
}

android {
    namespace 'com.danny.gatasguerreras'
    compileSdk 35

    defaultConfig {
        applicationId "com.danny.gatasguerreras"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    // Firma fija para que cada APK nuevo se instale encima del anterior sin desinstalar
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'html'
    }
}
